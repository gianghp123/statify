openapi: "3.0.3"
info:
  title: Statify API
  description: API for managing projects and static site deployments.
  version: "1.0.0"
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                username:
                  type: string
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/github:
    get:
      tags:
        - Authentication
      summary: Initiates GitHub OAuth
      responses:
        "302":
          description: Redirect to GitHub
  /auth/github/callback:
    get:
      tags:
        - Authentication
      summary: Handle OAuth Code
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OAuth successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /projects:
    get:
      tags:
        - Projects
      summary: List Projects
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApiResponse"
    post:
      tags:
        - Projects
      summary: Create Project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - subdomain
              properties:
                name:
                  type: string
                subdomain:
                  type: string
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /projects/{project_id}:
    get:
      tags:
        - Projects
      summary: Get Project Details
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    put:
      tags:
        - Projects
      summary: Update Project
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - Projects
      summary: Delete Project
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /projects/{project_id}/deployments:
    get:
      tags:
        - Deployments
      summary: Get Deployment History
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Deployment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApiResponse"
    post:
      tags:
        - Deployments
      summary: Create Deployment (Upload Zip)
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Deployment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /deployments:
    get:
      tags:
        - Deployments
      summary: Get Global Deployment History
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Global deployment history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedApiResponse"
  /deployments/{id}/toggle-spa-mode:
    put:
      tags:
        - Deployments
      summary: Toggle SPA mode for a deployment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: SPA mode toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /deployments/{id}/:
    delete:
      tags:
        - Deployments
      summary: Delete a deployment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deployment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /projects/{project_id}/deployments/{id}:
    get:
      tags:
        - Deployments
      summary: Get Single Deployment Status
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deployment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - Deployments
      summary: Delete Deployment
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deployment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /projects/{project_id}/deployments/{id}/live:
    put:
      tags:
        - Deployments
      summary: Set a deployment to live
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deployment turned live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /projects/{project_id}/deployments/{id}/offline:
    put:
      tags:
        - Deployments
      summary: Set a deployment to offline
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deployment turned offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /projects/{project_id}/stream-analytics:
    get:
      tags:
        - Analytics
      summary: Stream analytics events (SSE)
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: SSE stream of analytics metrics
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ComprehensiveMetrics"

  /projects/{project_id}/analytics:
    get:
      tags:
        - Analytics
      summary: Get comprehensive analytics metrics
      security:
        - bearerAuth: []
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: integer
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Comprehensive metrics retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /serve-files/{file_name}:
    get:
      tags:
        - Deployments
      summary: Serve static files for a project
      parameters:
        - name: file_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
        "304":
          description: Not modified
        "404":
          description: File not found

  /users/{id}:
    get:
      tags:
        - Users
      summary: Get User Profile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - Users
      summary: Delete User Account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
  /users/profile:
    put:
      tags:
        - Users
      summary: Update User Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        subdomain:
          type: string
        url:
          type: string
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Deployment:
      type: object
      properties:
        id:
          type: integer
        project:
          $ref: "#/components/schemas/Project"
        status:
          $ref: "#/components/schemas/DeploymentStatus"
        validation_error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        is_SPA:
          type: boolean
    DeploymentStatus:
      type: string
      enum: [QUEUED, FAILED, UPLOADED, READY, DELETED, PROCESSING, LIVE]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        subdomain:
          type: string
    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
    ComprehensiveMetrics:
      type: object
      properties:
        performance_metrics:
          $ref: "#/components/schemas/PerformanceMetrics"
        project_overview_metrics:
          $ref: "#/components/schemas/ProjectOverviewMetrics"
        time_series_points:
          type: array
          items:
            $ref: "#/components/schemas/TimeSeriesPoint"
    PerformanceMetrics:
      type: object
      properties:
        avg_response_ms:
          type: number
    ProjectOverviewMetrics:
      type: object
      properties:
        total_requests:
          type: integer
          format: int64
        total_bandwidth:
          type: integer
          format: int64
        avg_response_ms:
          type: number
        error_rate_percent:
          type: number
    TimeSeriesPoint:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        requests:
          type: integer
          format: int64
        bandwidth:
          type: integer
          format: int64
    Pagination:
      type: object
      properties:
        total_count:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: object
          nullable: true
    PaginatedApiResponse:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: "#/components/schemas/Pagination"
