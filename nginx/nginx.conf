worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  keepalive_timeout 65;

  log_format debug_format '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        'host: "$host" to_upstream: "$upstream_addr"';

  access_log /var/log/nginx/access.log debug_format;

  server {
    listen 80;
    server_name statify.online;

    location / {
        proxy_pass http://host.docker.internal:3000; 
        proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name api.statify.online;

    location / {
        proxy_pass http://host.docker.internal:8000; 
        proxy_set_header Host $host;
    }
  }

  server {
    listen 80;
    server_name *.statify.online; # Matches testing.localhost, demo.localhost, etc.

    location / {
        # Pass the request to your Go backend (running on port 8080)
        proxy_pass http://host.docker.internal:8000/api/v1/serve-files/;
        
        # Pass the Host header so Go knows which subdomain was requested
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
