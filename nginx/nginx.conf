worker_processes auto;
events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name *.localhost; # Matches testing.localhost, demo.localhost, etc.

    location / {
        # Pass the request to your Go backend (running on port 8080)
        proxy_pass http://host.docker.internal:8000/api/v1/serve-files/;
        
        # Pass the Host header so Go knows which subdomain was requested
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
